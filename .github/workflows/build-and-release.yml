name: Build And Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.14.4)'
        required: false
        type: string
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  QXP_RUNTIME_CONFIG_URL: ${{ secrets.QXP_RUNTIME_CONFIG_URL }}
  QXP_SERVER_ORIGIN: ${{ secrets.QXP_SERVER_ORIGIN }}
  QXP_API_BASE_URL: ${{ secrets.QXP_API_BASE_URL }}
  QXP_WS_URL: ${{ secrets.QXP_WS_URL }}
  QXP_CALLS_ENABLED: ${{ secrets.QXP_CALLS_ENABLED }}
  QXP_CALLS_UNAVAILABLE_REASON: ${{ secrets.QXP_CALLS_UNAVAILABLE_REASON }}

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read app version
        id: version
        shell: bash
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          if [ "$APP_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  build-tauri:
    name: Build ${{ matrix.platform_name }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: write
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_name: Linux-x64
            runner: ubuntu-22.04
            rust_targets: ''
            args: --bundles appimage,deb,rpm
            release_files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/**/*.tar.gz
              src-tauri/target/release/bundle/**/*.sig
          - platform_name: Linux-arm64
            runner: ubuntu-24.04-arm
            rust_targets: ''
            args: --bundles appimage,deb,rpm
            release_files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/**/*.tar.gz
              src-tauri/target/release/bundle/**/*.sig
          - platform_name: Windows-x64
            runner: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles msi
            release_files: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.zip
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.sig
          - platform_name: Windows-arm64
            runner: windows-latest
            rust_targets: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --bundles msi
            release_files: |
              src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/aarch64-pc-windows-msvc/release/bundle/**/*.zip
              src-tauri/target/aarch64-pc-windows-msvc/release/bundle/**/*.sig
          - platform_name: macOS
            runner: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            release_files: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/universal-apple-darwin/release/bundle/**/*.sig

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Verify Rust toolchain binaries
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          command -v cargo
          cargo --version
          command -v rustc
          rustc --version

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target # adjust if your Tauri dir differs

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform_name, 'Linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            wget \
            file \
            curl \
            libxdo-dev \
            xdg-utils

      - name: Build desktop bundle
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          QXP_RUNTIME_CONFIG_URL: ${{ env.QXP_RUNTIME_CONFIG_URL }}
          QXP_SERVER_ORIGIN: ${{ env.QXP_SERVER_ORIGIN }}
          QXP_API_BASE_URL: ${{ env.QXP_API_BASE_URL }}
          QXP_WS_URL: ${{ env.QXP_WS_URL }}
          QXP_CALLS_ENABLED: ${{ env.QXP_CALLS_ENABLED }}
          QXP_CALLS_UNAVAILABLE_REASON: ${{ env.QXP_CALLS_UNAVAILABLE_REASON }}
        run: |
          chmod +x scripts/build-tauri-ci.sh
          scripts/build-tauri-ci.sh ${{ matrix.args }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qxchat-${{ matrix.platform_name }}
          if-no-files-found: error
          path: ${{ matrix.release_files }}

      - name: Trigger Nix pnpm hash update
        if: matrix.platform_name == 'Linux-x64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update-npm-deps-hash.yml --ref main

  build-android:
    name: Build Android APK
    needs: prepare-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/tauri.conf.json', 'src-tauri/Cargo.toml', 'package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Configure Android signing
        shell: bash
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ]; then
            echo "::error::Missing Android signing secrets. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS."
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/lqxp-release-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"

          {
            echo "ANDROID_KEYSTORE_PATH=$keystore_path"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build Android APK
        shell: bash
        env:
          QXP_RUNTIME_CONFIG_URL: ${{ env.QXP_RUNTIME_CONFIG_URL }}
          QXP_SERVER_ORIGIN: ${{ env.QXP_SERVER_ORIGIN }}
          QXP_API_BASE_URL: ${{ env.QXP_API_BASE_URL }}
          QXP_WS_URL: ${{ env.QXP_WS_URL }}
          QXP_CALLS_ENABLED: ${{ env.QXP_CALLS_ENABLED }}
          QXP_CALLS_UNAVAILABLE_REASON: ${{ env.QXP_CALLS_UNAVAILABLE_REASON }}
          EXPECTED_API_BASE_URL: https://qxch.at
          APP_VERSION: ${{ needs.prepare-release.outputs.app_version }}
        run: |
          chmod +x scripts/build-android-ci.sh
          nix develop --command env APP_VERSION="$APP_VERSION" EXPECTED_API_BASE_URL="$EXPECTED_API_BASE_URL" QXP_RUNTIME_CONFIG_URL="$QXP_RUNTIME_CONFIG_URL" QXP_SERVER_ORIGIN="$QXP_SERVER_ORIGIN" QXP_API_BASE_URL="$QXP_API_BASE_URL" QXP_WS_URL="$QXP_WS_URL" QXP_CALLS_ENABLED="$QXP_CALLS_ENABLED" QXP_CALLS_UNAVAILABLE_REASON="$QXP_CALLS_UNAVAILABLE_REASON" scripts/build-android-ci.sh

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qxchat-android
          if-no-files-found: error
          path: |
            src-tauri/gen/android/app/build/outputs/apk/release/*.apk

  publish-release:
    name: Publish Release
    needs:
      - prepare-release
      - build-tauri
      - build-android
      - build-ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qxchat-*
          path: release-assets
          merge-multiple: true

      - name: Generate Nix flake
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare-release.outputs.app_version }}
        run: |
          cat > "release-assets/QxChat_${APP_VERSION}_flake.nix" << FLAKE
          # QxChat ${APP_VERSION} — NixOS flake
          # Drop this into your NixOS configuration to install QxChat.
          #
          # Usage (flake.nix):
          #
          #   {
          #     inputs.qxchat.url = "github:lqxp/app/releases/download/v${APP_VERSION}/QxChat_${APP_VERSION}_flake.nix";
          #     ...
          #   }
          #
          # Then in your NixOS module:
          #
          #   { inputs, ... }: {
          #     imports = [ inputs.qxchat.nixosModules.default ];
          #     nixpkgs.overlays = [ inputs.qxchat.overlays.default ];
          #     programs.qxchat.enable = true;
          #   }

          {
            description = "QxChat ${APP_VERSION} — NixOS flake";

            inputs = {
              nixpkgs.url = "github:NixOS/nixpkgs/nixos-unstable";

              qxchat-src = {
                url = "git+https://github.com/lqxp/app.git?ref=v${APP_VERSION}&submodules=1";
                flake = false;
              };
            };

            outputs =
              { self, nixpkgs, qxchat-src }:
              let
                systems = [
                  "x86_64-linux"
                  "aarch64-linux"
                ];

                forAllSystems = nixpkgs.lib.genAttrs systems;

                qxchatPackage =
                  { system }:
                  let
                    pkgs = import nixpkgs {
                      inherit system;
                      config.allowUnfree = true;
                    };
                  in
                  pkgs.callPackage "\${qxchat-src}/nix/qxchat.nix" { };
              in
              {
                nixosModules.default = import "\${qxchat-src}/nix/module.nix";

                overlays.default = final: prev: {
                  qxchat = prev.callPackage "\${qxchat-src}/nix/qxchat.nix" { };
                };

                packages = forAllSystems (
                  system:
                  {
                    default = qxchatPackage { inherit system; };
                    qxchat = qxchatPackage { inherit system; };
                  }
                );
              };
          }
          FLAKE
          echo "Generated release-assets/QxChat_${APP_VERSION}_flake.nix"

      - name: Generate latest.json for Tauri updater
        shell: python
        env:
          APP_VERSION: ${{ needs.prepare-release.outputs.app_version }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          import os, glob, json, datetime
          
          version = os.environ.get("APP_VERSION", "1.0.0")
          tag_name = os.environ.get("TAG_NAME", f"v{version}")
          repo = os.environ.get("GH_REPO", "lqxp/app")
          pub_date = datetime.datetime.now(datetime.timezone.utc).isoformat()
        
          print("=== ===")
          all_sigs = glob.glob("release-assets/**/*.sig", recursive=True)
          for s in all_sigs:
              print(f"  {s}")
          print(f"=== ===")
          
          platforms = {}
          for sig_file in glob.glob("release-assets/**/*.sig", recursive=True):
              asset_name = os.path.basename(sig_file)[:-4]
              with open(sig_file, "r") as f:
                  sig_content = f.read().strip()
              
              url = f"https://github.com/{repo}/releases/download/{tag_name}/{asset_name}"
              
              print(f"== {asset_name} ==")
              
              # Windows: .msi, .exe, .nsis.zip, .msi.zip
              if ".msi" in asset_name or ".exe" in asset_name or "nsis.zip" in asset_name or "msi.zip" in asset_name:
                  key = "windows-aarch64" if "arm64" in asset_name or "aarch64" in asset_name else "windows-x86_64"
                  platforms[key] = {"signature": sig_content, "url": url}
                  print(f"  -> {key}")
              # macOS: .app.tar.gz, .app.zip, or app.zip
              # Note: universal-apple-darwin produces "QxChat.app.tar.gz" or "QxChat_1.15.8_app.zip"
              elif ".app.tar.gz" in asset_name or ".app.zip" in asset_name or "app.zip" in asset_name:
                  if "aarch64" in asset_name and "x86_64" not in asset_name:
                      platforms["darwin-aarch64"] = {"signature": sig_content, "url": url}
                      print(f"  -> darwin-aarch64")
                  elif "x86_64" in asset_name and "aarch64" not in asset_name:
                      platforms["darwin-x86_64"] = {"signature": sig_content, "url": url}
                      print(f"  -> darwin-x86_64")
                  else:
                      platforms["darwin-aarch64"] = {"signature": sig_content, "url": url}
                      platforms["darwin-x86_64"] = {"signature": sig_content, "url": url}
                      print(f"  -> darwin-aarch64 + darwin-x86_64")
              # Linux: .AppImage or .AppImage.tar.gz
              elif ".AppImage" in asset_name:
                  key = "linux-aarch64" if "arm64" in asset_name or "aarch64" in asset_name else "linux-x86_64"
                  platforms[key] = {"signature": sig_content, "url": url}
                  print(f"  -> {key}")
              else:
                  print(f"  -> no match")
                  
          latest = {
              "version": version,
              "notes": f"Release v{version}",
              "pub_date": pub_date,
              "platforms": platforms
          }
          
          with open("release-assets/latest.json", "w") as f:
              json.dump(latest, f, indent=2)
          
          print("\release-assets/latest.json:")
          print(json.dumps(latest, indent=2))

      - name: Publish release with all assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
          APP_VERSION: ${{ needs.prepare-release.outputs.app_version }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          set -euo pipefail

          mapfile -d '' release_files < <(find release-assets -type f -print0 | sort -z)
          if [ "${#release_files[@]}" -eq 0 ]; then
            echo "::error::No release assets found."
            exit 1
          fi

          msi_x86=""
          while IFS= read -r -d '' file; do
            if [[ "$file" == *.msi && "$file" != *arm64* && "$file" != *aarch64* ]]; then
              msi_x86="$file"
              break
            fi
          done < <(find release-assets -type f -name '*.msi' -print0 | sort -z)

          if [ -z "$msi_x86" ]; then
            echo "::error::No MSI_x86 asset found for VirusTotal analysis."
            exit 1
          fi

          if [ -z "${VIRUSTOTAL_API_KEY:-}" ]; then
            echo "::error::Missing VIRUSTOTAL_API_KEY secret."
            exit 1
          fi

          upload_url=$(curl --fail --silent --show-error \
            --request GET \
            --url https://www.virustotal.com/api/v3/files/upload_url \
            --header "x-apikey: ${VIRUSTOTAL_API_KEY}" \
            | jq -r '.data')

          if [ -z "$upload_url" ] || [ "$upload_url" = "null" ]; then
            echo "::error::VirusTotal upload URL was not returned."
            exit 1
          fi

          analysis_id=$(curl --fail --silent --show-error \
            --request POST \
            --url "$upload_url" \
            --header "x-apikey: ${VIRUSTOTAL_API_KEY}" \
            --form "file=@${msi_x86}" \
            | jq -r '.data.id')

          if [ -z "$analysis_id" ] || [ "$analysis_id" = "null" ]; then
            echo "::error::VirusTotal analysis ID was not returned."
            exit 1
          fi

          virustotal_url="https://www.virustotal.com/gui/file-analysis/${analysis_id}"
          release_notes=$'Legitimacy is supremacy.\n'"${virustotal_url}"

          # Delete existing release (and its assets) to avoid duplicate asset errors
          if gh release view "$TAG_NAME" &>/dev/null; then
            echo "Deleting existing release $TAG_NAME..."
            gh release delete "$TAG_NAME" --yes
          fi

          gh release create "$TAG_NAME" "${release_files[@]}" \
            --draft \
            --title "QxChat v${APP_VERSION}" \
            --notes "$release_notes"
          gh release edit "$TAG_NAME" --draft=false --latest

  build-ios:
    name: Build iOS (unsigned)
    needs: prepare-release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build unsigned IPA
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare-release.outputs.app_version }}
          QXP_RUNTIME_CONFIG_URL: ${{ env.QXP_RUNTIME_CONFIG_URL }}
          QXP_SERVER_ORIGIN: ${{ env.QXP_SERVER_ORIGIN }}
          QXP_API_BASE_URL: ${{ env.QXP_API_BASE_URL }}
          QXP_WS_URL: ${{ env.QXP_WS_URL }}
          QXP_CALLS_ENABLED: ${{ env.QXP_CALLS_ENABLED }}
          QXP_CALLS_UNAVAILABLE_REASON: ${{ env.QXP_CALLS_UNAVAILABLE_REASON }}
          EXPECTED_API_BASE_URL: https://qxch.at
        run: |
          chmod +x scripts/build-ios-ci.sh
          scripts/build-ios-ci.sh

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qxchat-ios-unsigned
          if-no-files-found: error
          path: |
            ${{ env.IPA_PATH }}
            ${{ env.APP_ZIP }}
