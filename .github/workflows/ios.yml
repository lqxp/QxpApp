name: iOS Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.14.4)'
        required: false
        type: string
        default: ''

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  QXP_SERVER_ORIGIN: ${{ secrets.QXP_SERVER_ORIGIN }}
  QXP_API_BASE_URL: ${{ secrets.QXP_API_BASE_URL }}
  QXP_WS_URL: ${{ secrets.QXP_WS_URL }}
  QXP_CALLS_ENABLED: ${{ secrets.QXP_CALLS_ENABLED }}
  QXP_CALLS_UNAVAILABLE_REASON: ${{ secrets.QXP_CALLS_UNAVAILABLE_REASON }}

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read app version
        id: version
        shell: bash
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$APP_VERSION" ]]; then
            APP_VERSION="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build iOS
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          QXP_SERVER_ORIGIN: ${{ env.QXP_SERVER_ORIGIN }}
          QXP_API_BASE_URL: ${{ env.QXP_API_BASE_URL }}
          QXP_WS_URL: ${{ env.QXP_WS_URL }}
          QXP_CALLS_ENABLED: ${{ env.QXP_CALLS_ENABLED }}
          QXP_CALLS_UNAVAILABLE_REASON: ${{ env.QXP_CALLS_UNAVAILABLE_REASON }}
          EXPECTED_API_BASE_URL: https://qxch.at
          # ── Optional: free Apple ID for 7-day signing ─────────
          # Without these, the build targets simulator (unsigned).
          # With a free Apple ID, produces a signed IPA installable for 7 days.
          # Create at: https://appleid.apple.com → App-Specific Password
          APPLE_ID: ${{ secrets.APPLE_ID || '' }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD || '' }}
        run: |
          chmod +x scripts/build-ios-ci.sh
          scripts/build-ios-ci.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: qxchat-ios
          if-no-files-found: error
          path: |
            ${{ env.IPA_PATH }}
            ${{ env.APP_ZIP }}

  publish-release:
    name: Publish Release (iOS)
    needs: build-ios
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: qxchat-ios
          path: release-assets

      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "::error::No iOS assets to attach."
            exit 1
          fi
          gh release upload "$TAG_NAME" "${assets[@]}" --clobber
