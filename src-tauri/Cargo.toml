[package]
name = "qxchat"
version = "1.18.1"
description = "QxChat Client"
authors = []
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "qxchat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.3", features = ["custom-protocol", "tray-icon", "devtools"] }
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-process = "=2.3.0"
tauri-plugin-single-instance = "=2.3.4"
tauri-plugin-updater = "2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "native-tls", "socks"] }
windows = { version = "0.58", features = [
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Foundation",
  "Win32_System_Com",
] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "socks"] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
webkit2gtk = "2.0.2"
# System-audio capture: `cpal` drives PulseAudio/PipeWire monitor sources.
cpal = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "8", features = ["macos_13_0"] }

# Tor connectivity (embedded client + SOCKS5 plumbing) is desktop-only. The
# mobile WebViews expose no per-app proxy and Arti's default native-tls backend
# does not cross-compile to Android/iOS, so gate the whole set out there.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arti-client = { version = "0.22", features = ["experimental-api", "geoip"] }
fast-socks5 = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-tungstenite = "0.24"
# `static` compiles SQLite from source (`rusqlite/bundled`) so the Windows GNU
# cross-compile does not need a system `libsqlite3` at link time.
tor-dirmgr = { version = "0.22", features = ["static"] }
# `experimental-api` unlocks `DataStream::circuit()` so we can surface the live
# circuit (guard → middle → exit) like Tor Browser.
tor-proto = { version = "0.22", features = ["experimental-api"] }
# `HasRelayIds`/`HasAddrs` are needed to read IPs + fingerprints off each hop.
tor-linkspec = "0.22"
# `HasCountryCode`/`CountryCode` label each relay with its country.
tor-geoip = "0.22"
# NetDir lookup (nickname + country) for each circuit hop; `experimental-api`
# unlocks `Relay::rs()` (nickname) and `geoip` unlocks `country_code()`.
tor-netdir = { version = "0.22", features = ["experimental-api", "geoip"] }
tor-rtcompat = "0.22"
