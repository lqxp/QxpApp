[package]
name = "qxchat"
version = "1.18.1"
description = "QxChat Client"
authors = []
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "qxchat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.3", features = ["custom-protocol", "tray-icon", "devtools"] }
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-process = "=2.3.0"
tauri-plugin-single-instance = "=2.3.4"
tauri-plugin-updater = "2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "native-tls"] }
windows = { version = "0.58", features = [
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Foundation",
  "Win32_System_Com",
] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
webkit2gtk = "2.0.2"
# System-audio capture: `cpal` drives PulseAudio/PipeWire monitor sources.
cpal = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "8", features = ["macos_13_0"] }
